<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-label="AI Justicia">
  <!-- Marca: balanza + rayo de IA (estilo moderno) -->
  <defs>
    <linearGradient id="lg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#036248"/>
    </linearGradient>
  </defs>
  <g transform="translate(4,4)">
    <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#lg-grad)"/>
    <!-- Plato superior de balanza como arco -->
    <path d="M7 14 Q16 8 25 14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Poste y base -->
    <line x1="16" y1="11" x2="16" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="11" y1="24" x2="21" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rayo IA (acento rojo) -->
    <path d="M17.5 15 L14.5 20 L16 20 L14.5 24 L18.5 18.5 L17 18.5 Z" fill="#c81e1e"/>
  </g>
  <!-- Wordmark -->
  <text x="48" y="19" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#0f172a">AI Justicia</text>
  <text x="48" y="31" font-family="Inter, sans-serif" font-size="7.5" font-weight="500" fill="#64748b" letter-spacing="0.5">DERECHO MEXICANO · IA VERIFICABLE</text>
</svg>
