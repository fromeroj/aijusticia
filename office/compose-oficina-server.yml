name: aijusticia-oficina

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nc_oficina_2026
    volumes:
      - /opt/aijusticia/oficina/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped

  app:
    image: nextcloud:31-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nc_oficina_2026
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: tlamatini2026
      NEXTCLOUD_TRUSTED_DOMAINS: 162.35.113.166 oficina.aijusticia.mx
    volumes:
      - /opt/aijusticia/oficina/html:/var/www/html
    extra_hosts:

      - "aijusticia.mx:192.227.167.147"

  collabora:
    image: collabora/code:latest
    restart: unless-stopped
    environment:
      - aliasgroup1=https://oficina.konen.guru
      - username=cola
      - password=colabora2026
      - extra_params=--o:ssl.enable=true --o:ssl.termination=true --o:net.post_allow.hosts=0.0.0.0/0
    ports:
      - "9980:9980"
    cap_add:
      - MKNOD
