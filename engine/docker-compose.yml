# PostgreSQL 16 + pgvector — MISMA VERSIÓN que el server (182.255.84.124)
# pgvector/pgvector:pg16 garantiza compatibilidad de dumps entre Mac y server
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aijusticia-postgres
    environment:
      POSTGRES_USER: aijusticia
      POSTGRES_PASSWORD: aijusticia
      POSTGRES_DB: aijusticia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijusticia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
