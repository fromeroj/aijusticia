name: aijusticia-pilot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud_pilot_2026
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped

  app:
    image: nextcloud:31-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud_pilot_2026
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: tlamatini2026
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    volumes:
      - nc_data:/var/www/html

  collabora:
    image: collabora/code:latest
    restart: unless-stopped
    environment:
      - aliasgroup1=http://app:80
      - username=cola
      - password=colabora2026
      - extra_params=--o:ssl.enable=false --o:net.post_allow.hosts=0.0.0.0/0
    ports:
      - "9980:9980"
    cap_add:
      - MKNOD

volumes:
  db_data:
  nc_data:
